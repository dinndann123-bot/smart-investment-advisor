name: One-time patch runtime initializer

on:
  push:
    paths:
      - '.github/workflows/patch-runtime-init.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale updateApiStatus startup call
        shell: python
        run: |
          from pathlib import Path
          old = 'renderWeekly();updateApiStatus();setחיBadge();'
          new = 'renderWeekly();setחיBadge();'
          changed = False
          for name in ('index.html', 'static/index.html'):
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if old in text:
                  p.write_text(text.replace(old, new, 1), encoding='utf-8')
                  changed = True
                  print(f'patched {name}')
              else:
                  print(f'no stale initializer in {name}')
          Path('.runtime_patch_changed').write_text('1' if changed else '0')
      - name: Commit patch
        shell: bash
        run: |
          if [ "$(cat .runtime_patch_changed)" != "1" ]; then
            echo "Nothing to commit"
            exit 0
          fi
          rm -f .runtime_patch_changed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html static/index.html
          git commit -m "Fix stale frontend startup initializer"
          git push
