name: Install strategy validation

on:
  push:
    paths:
      - 'strategy_validation.py'
      - '.github/workflows/install-strategy-validation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app and UI
        shell: python
        run: |
          from pathlib import Path

          app = Path('app.py')
          text = app.read_text(encoding='utf-8')
          marker = '# STRATEGY_VALIDATION_V1'
          if marker not in text:
              text += '''\n\n# STRATEGY_VALIDATION_V1\nfrom strategy_validation import install_strategy_validation\ninstall_strategy_validation(app)\n'''
              app.write_text(text, encoding='utf-8')
              print('patched app.py')
          else:
              print('app.py already patched')

          ui = Path('static/index.html')
          html = ui.read_text(encoding='utf-8')
          js_marker = '// STRATEGY_VALIDATION_UI_V1'
          if js_marker not in html:
              snippet = r'''

// STRATEGY_VALIDATION_UI_V1
function installStrategyValidationPanel(){
  if(document.getElementById('strategyValidationCard'))return;
  const anchor=document.getElementById('homeLearningPanel')||document.querySelector('#home .cards')||document.querySelector('.shell');
  if(!anchor)return;
  const wrap=document.createElement('div');
  wrap.id='strategyValidationCard';
  wrap.className='card';
  wrap.style.marginTop='16px';
  wrap.innerHTML=`
    <div class="section-head" style="margin:0 0 10px">
      <div><h2 style="font-size:20px">אימות היסטורי לשיטת המסחר</h2><p>בדיקת walk-forward: משתמשת רק בנתונים שהיו זמינים עד 10:00 ניו יורק, ואז בודקת מה קרה בהמשך היום.</p></div>
      <button class="btn btn-primary" id="runStrategyValidationBtn" onclick="runStrategyValidation()">הרץ אימות</button>
    </div>
    <div id="strategyValidationStatus" class="note">עדיין לא הורץ אימות בגרסה הזו.</div>
    <div id="strategyValidationResults"></div>`;
  anchor.insertAdjacentElement('beforebegin',wrap);
}

function pctv(v){return v==null?'—':`${Number(v).toFixed(1)}%`}
async function runStrategyValidation(){
  const btn=document.getElementById('runStrategyValidationBtn');
  const status=document.getElementById('strategyValidationStatus');
  const out=document.getElementById('strategyValidationResults');
  if(btn)btn.disabled=true;
  if(status)status.textContent='מריץ בדיקה היסטורית על עשרות ימי מסחר. זה יכול לקחת כחצי דקה...';
  if(out)out.innerHTML='';
  try{
    const r=await fetch('/api/strategy/validate?days=60&symbols=20',{cache:'no-store'});
    const j=await r.json();
    if(!r.ok)throw new Error(j.detail||'האימות נכשל');
    const s=j.selected||{}, t=s.test||{};
    const good=(t.signals||0)>=8 && (s.lift_vs_baseline||0)>=1.15;
    const verdict=good?'השיטה מציגה יתרון במדגם הבדיקה':'עדיין אין יתרון מספיק חזק במדגם הבדיקה';
    if(status)status.innerHTML=`<b>${verdict}</b> · ${j.samples?.test||0} דגימות holdout · Feed: ${(j.feed||'').toUpperCase()}`;
    const buckets=(j.score_buckets_test||[]).map(b=>`<tr><td>${b.bucket}</td><td>${b.samples}</td><td>${pctv(b.hit_rate_pct)}</td><td>${pctv(b.avg_max_up_pct)}</td></tr>`).join('');
    out.innerHTML=`
      <div class="cards" style="margin-top:12px">
        <div class="card metric"><b>${s.model||'—'}</b><span>מודל שנבחר על train בלבד</span></div>
        <div class="card metric"><b>${s.threshold??'—'}</b><span>סף כניסה שנבחר</span></div>
        <div class="card metric"><b>${pctv(t.hit_rate_pct)}</b><span>פגע ב־5%+ אחרי 10:00</span></div>
        <div class="card metric"><b>${s.lift_vs_baseline??'—'}×</b><span>שיפור מול בסיס holdout</span></div>
      </div>
      <div class="table-wrap" style="margin-top:12px"><table class="compact-table"><thead><tr><th>טווח ציון</th><th>דגימות</th><th>שיעור הצלחה</th><th>עלייה מקס' ממוצעת</th></tr></thead><tbody>${buckets}</tbody></table></div>
      <div class="plan-note" style="margin-top:12px"><b>משקולות מומלצות כרגע:</b> מומנטום ${Math.round((s.weights?.momentum||0)*100)}% · RVOL ${Math.round((s.weights?.rvol||0)*100)}% · נזילות ${Math.round((s.weights?.liquidity||0)*100)}% · מבנה תוך־יומי ${Math.round((s.weights?.structure||0)*100)}% · מחיר/סחירות ${Math.round((s.weights?.price||0)*100)}%.<br><span class="small">חדשות נשארות שכבת אישור נפרדת כי באימות הזה לא השתמשנו בחדשות היסטוריות. אין כאן look-ahead בתכונות.</span></div>`;
  }catch(e){
    if(status)status.textContent='❌ '+e.message;
  }finally{
    if(btn)btn.disabled=false;
  }
}
'''
              target = "if(location.protocol==='file:'){"
              if target not in html:
                  raise SystemExit('initializer target not found')
              html = html.replace(target, snippet + "\n" + target, 1)
              init_old = "initializeVisibleClocks();renderHome();renderTables();renderBacktests();renderWeekly();setחיBadge();checkBackendStatus();"
              init_new = "initializeVisibleClocks();renderHome();renderTables();renderBacktests();renderWeekly();installStrategyValidationPanel();setחיBadge();checkBackendStatus();"
              if init_old in html:
                  html = html.replace(init_old, init_new, 1)
              else:
                  raise SystemExit('runtime initializer target not found')
              ui.write_text(html, encoding='utf-8')
              print('patched static/index.html')
          else:
              print('UI already patched')
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py static/index.html
          git commit -m "Add walk-forward strategy validation dashboard"
          git push
