name: Install strategy validation

on:
  push:
    paths:
      - 'strategy_validation.py'
      - 'static/strategy_validation_ui.js'
      - '.github/workflows/install-strategy-validation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app and UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('app.py')
          text = app.read_text(encoding='utf-8')
          marker = '# STRATEGY_VALIDATION_V1'
          if marker not in text:
              text += "\n\n# STRATEGY_VALIDATION_V1\nfrom strategy_validation import install_strategy_validation\ninstall_strategy_validation(app)\n"
              app.write_text(text, encoding='utf-8')
              print('patched app.py')
          else:
              print('app.py already patched')

          ui = Path('static/index.html')
          html = ui.read_text(encoding='utf-8')
          tag = '<script src="/static/strategy_validation_ui.js?v=1"></script>'
          if tag not in html:
              if '</body>' not in html:
                  raise SystemExit('closing body tag not found')
              html = html.replace('</body>', tag + '\n</body>', 1)
              ui.write_text(html, encoding='utf-8')
              print('patched static/index.html')
          else:
              print('static/index.html already patched')
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py static/index.html
          git commit -m "Add walk-forward strategy validation dashboard"
          git push
