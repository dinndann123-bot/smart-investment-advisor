name: Keep market learning awake

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'scanner_core.py'
      - 'scheduled_learning.py'
      - 'chart_api_v7.py'
      - '.github/workflows/market-learning-wakeup.yml'
  schedule:
    # New York is UTC-4 while daylight time is in effect. These short
    # windows wake the free Render service before and around each checkpoint.
    - cron: '55 11 * * 1-5'
    - cron: '0 12 * * 1-5'
    - cron: '20,25,40,45,50 13 * * 1-5'
    - cron: '5,10,15,20,50,55 14 * * 1-5'
    - cron: '0,5 15 * * 1-5'
    - cron: '20,25,30,35 17 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-learning-wakeup
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake scheduler and request evaluation
        shell: bash
        run: |
          base='https://smart-investment-advisor-yjtz.onrender.com'
          curl --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 45 "$base/" >/dev/null
          scanner_status="$(curl --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 45 \
            "$base/api/scanner/async-status")"
          python -c 'import json,sys; d=json.load(sys.stdin); s=d.get("scheduled_learning") or {}; assert d.get("installed") is True and d.get("live_market_source")=="Alpaca" and s.get("installed") is True, "scanner or scheduler not ready: "+str(d); print("scanner service: installed; source=Alpaca; scheduler=installed")' <<<"$scanner_status"

          scan=''
          for attempt in $(seq 1 15); do
            if scan="$(curl --fail --silent --max-time 25 \
              "$base/api/scanner/day?top=10&candidates=120")" && \
              python -c 'import json,sys; d=json.load(sys.stdin); j=d.get("scanner_job") or {}; assert j.get("status")=="complete" and not d.get("scan_pending")' <<<"$scan"; then
              break
            fi
            scan=''
            sleep 10
          done
          test -n "$scan" || { echo 'scanner did not complete within 150 seconds'; exit 1; }
          python -c 'import json,sys; d=json.load(sys.stdin); j=d.get("scanner_job") or {}; h=d.get("market_data_health") or j.get("market_data_health") or {}; q=h.get("quality"); session=d.get("session"); rows=d.get("results") or []; assert d.get("data_source")=="Alpaca", "scanner source invalid: "+str(d.get("data_source")); assert (q in {"market_closed","current_market_data","no_session_trades","stale_or_waiting","waiting_for_delayed_feed"}) or (session!="regular" and q=="mixed_or_unknown" and not rows and h.get("sample_rows",0)==0), "scanner data health invalid: "+str(session)+" "+str(h); assert session!="regular" or (q=="current_market_data" and len(rows)==10 and all(x.get("price") and x.get("market_timestamp") for x in rows)), "regular-session rows incomplete or unhealthy: "+str(len(rows))+" "+str(h); print("scanner: session=%s health=%s rows=%s" % (session,q,len(rows)))' <<<"$scan"

          status=''
          for attempt in $(seq 1 12); do
            if status="$(curl --fail --silent --max-time 20 \
              "$base/api/learning/scheduled-status")" && \
              python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("installed") is True' <<<"$status"; then
              break
            fi
            status=''
            sleep 15
          done
          test -n "$status" || { echo 'scheduler endpoint did not become ready with installed=true'; exit 1; }
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("installed") is True, f"scheduler not installed: {d}"; print("scheduler: installed")' <<<"$status"

          capture="$(curl --fail --silent --show-error --max-time 150 -X POST "$base/api/learning/capture-due")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert not d.get("missed_checkpoints"), "missed scheduled checkpoints: "+str(d.get("missed_checkpoints")); assert not d.get("checkpoint_due") or d.get("captured") is True, "due checkpoint was not saved: "+str(d); print("checkpoint: %s captured=%s" % (d.get("checkpoint") or "none due",d.get("captured")))' <<<"$capture"

          chart="$(curl --fail --silent --show-error --retry 2 --retry-delay 10 --max-time 60 \
            "$base/api/market/chart/SPY?range=1D")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("source")=="Alpaca" and d.get("count",0)>0 and d.get("last_bar_at"), "chart data invalid"; print("chart: %s Alpaca bars, last=%s" % (d["count"], d["last_bar_at"]))' <<<"$chart"

          summary="$(curl --fail --silent --show-error --retry 2 --retry-delay 10 --max-time 90 \
            "$base/api/learning/summary")"
          python -c 'import json,sys; d=json.load(sys.stdin); s=d.get("storage") or {}; assert s.get("durable") is True and s.get("connected") is True, "learning storage unavailable"; print("learning storage: %s signals, strategy=%s" % (d.get("signals", 0), d.get("strategy_version")))' <<<"$summary"

          weekly="$(curl --fail --silent --show-error --retry 2 --retry-delay 10 --max-time 45 \
            "$base/api/learning/weekly-summary")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("calendar_source")=="alpaca_calendar", "market calendar unavailable: "+str(d); print("weekly learning: status=%s coverage=%s/%s evaluated=%s success=%s" % (d.get("status"),d.get("covered_sessions"),d.get("expected_sessions"),d.get("evaluated_15m"),d.get("success_rate_pct")))' <<<"$weekly"
