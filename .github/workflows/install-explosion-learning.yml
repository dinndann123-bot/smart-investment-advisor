name: Install explosion learning
on:
  push:
    branches: [main]
    paths:
      - 'explosion_learning.py'
      - '.github/workflows/install-explosion-learning.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch app
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text()
          marker='# EXPLOSION_LEARNING_V1'
          block='\n\n# EXPLOSION_LEARNING_V1\nfrom explosion_learning import install_explosion_learning\ninstall_explosion_learning(app)\n'
          if marker not in s:
              p.write_text(s.rstrip()+block)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Wire explosion learning endpoint'
          git push
