name: Install mobile header r17
on:
  push:
    branches: [main]
    paths: ['.github/workflows/install-mobile-header-r17.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('.hero h1{font-size:38px;margin:0 0 8px;font-weight:900;letter-spacing:-.5px}', '.hero h1{font-size:38px;margin:0 0 8px;font-weight:900;letter-spacing:-.5px}.brand-title{display:flex;align-items:center;gap:12px}.brand-logo{width:52px;height:52px;border-radius:14px;object-fit:contain;background:rgba(255,255,255,.12);padding:5px}.header-back{display:none;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;border-radius:12px;width:44px;height:44px;font-size:26px;cursor:pointer}')
          s=s.replace('  .hero{padding:20px 16px 16px}.hero h1{font-size:29px}.shell{padding:12px 12px 92px}', '  .hero{padding:20px 16px 16px}.hero h1{font-size:29px}.hero-inner{align-items:flex-start;flex-wrap:nowrap}.brand-title{gap:8px}.brand-logo{width:42px;height:42px;border-radius:11px}.header-back{display:grid;place-items:center;flex:0 0 auto}.hero-actions{display:none!important}.shell{padding:12px 12px 92px}')
          old='''      <div>\n        <h1>היועץ החכם להשקעות</h1>'''
          new='''      <button class="header-back" id="headerBackBtn" onclick="goBackPage()" aria-label="חזרה למסך הקודם">‹</button>\n      <div>\n        <div class="brand-title"><img class="brand-logo" src="/static/icons/icon-192.png" alt="לוגו השור"><h1>היועץ החכם להשקעות</h1></div>'''
          if old not in s: raise SystemExit('header marker missing')
          s=s.replace(old,new,1)
          # Remove duplicate portfolio/settings header controls; retain install button for desktop/PWA prompt.
          s=s.replace('''        <button class="btn btn-light" onclick="go('portfolio')">התיק שלי</button>\n        <button class="btn btn-ghost" onclick="go('settings')">הגדרות</button>\n''','')
          # Add lightweight navigation history before closing body.
          marker='</body>'
          js='''<script>\n(function(){\n  const hist=[];\n  const original=window.go;\n  if(typeof original==='function'){\n    window.go=function(page){\n      const active=document.querySelector('.page.active');\n      const current=active&&active.id?active.id.replace('page-',''):null;\n      if(current&&current!==page&&hist[hist.length-1]!==current) hist.push(current);\n      return original.apply(this,arguments);\n    };\n  }\n  window.goBackPage=function(){\n    const previous=hist.pop();\n    if(previous&&typeof original==='function') return original(previous);\n    if(window.history.length>1) return window.history.back();\n    if(typeof original==='function') return original('home');\n  };\n})();\n</script>\n'''
          if marker not in s: raise SystemExit('body marker missing')
          s=s.replace(marker,js+marker,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Simplify mobile header and add bull branding"
          git push
