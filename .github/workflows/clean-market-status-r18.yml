name: Clean market status r18
on:
  push:
    branches: [main]
    paths: ['.github/workflows/clean-market-status-r18.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch status UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='</body>'
          patch=r'''<script id="market-status-r18">
(function(){
  const el=document.getElementById('apiStatus');
  if(!el)return;
  const clean=()=>{
    const t=(el.textContent||'').trim();
    if(/Alpaca/i.test(t) && !/(שגיאה|מנותק|לא מחובר|failed|error)/i.test(t)){
      el.textContent='● נתוני שוק מחוברים • Alpaca פעיל';
      return;
    }
    if(/Alpha\s*Vantage/i.test(t)){
      el.textContent=t.replace(/\s*[•|·-]?\s*Alpha\s*Vantage[^•|·]*?(?=\s*[•|·]|$)/ig,'').replace(/\s{2,}/g,' ').trim();
    }
  };
  clean();
  new MutationObserver(clean).observe(el,{childList:true,subtree:true,characterData:true});
})();
</script>
'''
          if 'id="market-status-r18"' not in s:
              s=s.replace(marker,patch+marker,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Show only relevant market data connection status"
          git push
