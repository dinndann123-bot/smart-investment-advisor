name: Install day scan sync r16
on:
  push:
    branches: [main]
    paths:
      - 'static/day_sync_r16.js'
      - '.github/workflows/install-day-sync-r16.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject day sync script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sitecustomize.py')
          s=p.read_text()
          marker='        feature_patch = r\'\'\'<script id="portfolio-timing-ocr-r12">'
          block='''        day_sync_tag = '<script src="/static/day_sync_r16.js?v=16"></script>'\n        if 'day_sync_r16.js' not in html:\n            html = html.replace('</head>', day_sync_tag + '\\n</head>', 1)\n\n'''
          if 'day_sync_r16.js' not in s:
              if marker not in s: raise SystemExit('injection marker not found')
              s=s.replace(marker,block+marker,1)
              p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitecustomize.py
          git diff --cached --quiet || git commit -m 'Keep home and day-trading lists synchronized'
          git push
